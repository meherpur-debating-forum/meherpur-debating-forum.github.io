        .font-header-en { font-family: 'Header-En', sans-serif; }
        .font-header-bn { font-family: 'Header-Bn', sans-serif; }
        .font-content-en { font-family: 'Content-En', sans-serif; }

        /* General Styling */
        body {
            background-color: #0f172a;

        /* Glassmorphism Classes */

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }

        }
        .animate-pulse-slow {

            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        };

        // --- CUSTOM UI COMPONENTS ---
        const CustomInput = ({ label, type = 'text', value, onChange, placeholder, required, icon: Icon }) => (
            <div className="mb-4 relative">
                {label && <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider font-content-bn">{label}</label>}
                <div className="relative flex items-center">
                    {Icon && <div className="absolute left-3.5 text-slate-400"><Icon /></div>}
                    <input 
                        type={type} 
                        value={value || ''} 
                        onChange={e => onChange(e.target.value)}
                        placeholder={placeholder}
                        required={required}
                        className={`w-full bg-slate-800/80 border border-slate-700/80 rounded-xl py-2.5 px-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all shadow-inner ${Icon ? 'pl-11' : ''} font-content-en text-sm`}
                    />
                </div>
            </div>
        );

        const CustomSelect = ({ label, options, value, onChange, placeholder }) => {
            const [isOpen, setIsOpen] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (ref.current && !ref.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="mb-4 relative" ref={ref}>
                    {label && <label className="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider font-content-bn">{label}</label>}
                    <div 
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl py-2.5 px-4 flex justify-between items-center cursor-pointer shadow-inner hover:border-indigo-500/50 transition-all text-sm"
                    >
                        <span className={value ? 'text-slate-100 font-content-en' : 'text-slate-500'}>
                            {value ? options.find(o => String(o.value) === String(value))?.label || value : placeholder}
                        </span>
                        <Icons.ChevronDown />
                    </div>
                    {isOpen && (
                        <div className="absolute z-50 w-full mt-1.5 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl max-h-60 overflow-y-auto custom-scrollbar">
                            {options.map((opt, idx) => (
                                <div 
                                    key={idx}
                                    onClick={() => { onChange(opt.value); setIsOpen(false); }}
                                    className={`px-4 py-2.5 cursor-pointer hover:bg-indigo-600/30 transition-colors font-content-en text-sm ${String(value) === String(opt.value) ? 'bg-indigo-600/50 text-indigo-200 font-bold' : 'text-slate-300'}`}
                                >
                                    {opt.label}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const CustomButton = ({ children, onClick, type = 'button', variant = 'primary', className = '', isLoading = false }) => {
            const baseStyle = "flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-medium transition-all transform active:scale-95 outline-none font-content-bn text-sm";
            const variants = {
                primary: "bg-gradient-to-r from-indigo-600 to-violet-600 text-white hover:from-indigo-500 hover:to-violet-500 shadow-lg shadow-indigo-600/30",
                secondary: "bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 hover:text-white",
                danger: "bg-gradient-to-r from-red-600 to-rose-600 text-white hover:from-red-500 hover:to-rose-500 shadow-lg shadow-red-600/30",
                success: "bg-gradient-to-r from-emerald-600 to-teal-600 text-white hover:from-emerald-500 hover:to-teal-500 shadow-lg shadow-emerald-600/30"
            };
            return (
                <button type={type} onClick={onClick} disabled={isLoading} className={`${baseStyle} ${variants[variant]} ${className} ${isLoading ? 'opacity-70 cursor-not-allowed' : ''}`}>
                    {isLoading ? <div className="loader w-4 h-4"></div> : children}
                </button>
            );
        };

        const CustomToggle = ({ checked, onChange, label }) => (
            <div className="flex items-center cursor-pointer" onClick={() => onChange(!checked)}>
                <div className={`relative w-12 h-6 transition-colors rounded-full ${checked ? 'bg-indigo-600' : 'bg-slate-700'}`}>
                    <div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform transform ${checked ? 'translate-x-6' : 'translate-x-0'} shadow-md`}></div>
                </div>
                {label && <span className="ml-3 font-medium text-slate-300 font-content-bn">{label}</span>}
            </div>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-md">
                    <div className="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                        <div className="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
                            <h3 className="text-xl font-bold font-header-bn text-indigo-400">{title}</h3>
                            <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-800 text-slate-400 transition-colors"><Icons.X /></button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MODULES / VIEWS ---

        // 1. Dashboard (Site Status)
        const DashboardView = () => {
            const [status, setStatus] = useState(false);
            const [loading, setLoading] = useState(true);

            useEffect(() => { fetchStatus(); }, []);

            const fetchStatus = async () => {
                const { data, error } = await supabaseClient.from('d').select('id, d').limit(1).single();
                if (data) setStatus(data.d);
                setLoading(false);
            };

            const toggleStatus = async (newVal) => {
                setLoading(true);
                const { data } = await supabaseClient.from('d').select('id').limit(1).single();
                if (data) {
                    const { error } = await supabaseClient.from('d').update({ d: newVal }).eq('id', data.id);
                    if(error) alert(error.message);
                } else {
                    const { error } = await supabaseClient.from('d').insert([{ d: newVal }]);
                    if(error) alert(error.message);
                }
                setStatus(newVal);
                setLoading(false);
            };

            return (
                <div className="p-6 max-w-4xl mx-auto space-y-6">
                    <div className="glass-card rounded-2xl p-8 text-center border border-slate-800 shadow-xl">
                        <h2 className="text-3xl font-header-en text-white mb-2 tracking-wide">Welcome to Admin Dashboard</h2>
                        <p className="text-slate-400 font-content-bn mb-8">Meherpur Debating Forum ওয়েবসাইট পরিচালনা করুন</p>
                        
                        <div className="inline-flex flex-col items-center p-8 bg-slate-900/60 rounded-2xl border border-slate-800/80">
                            <h3 className="text-lg font-medium text-slate-300 mb-6 font-content-bn">ওয়েবসাইট সিস্টেম স্ট্যাটাস</h3>
                            {loading ? (
                                <div className="loader"></div>
                            ) : (
                                <div className="flex flex-col items-center gap-5">
                                    <CustomToggle checked={status} onChange={toggleStatus} />
                                    <div className={`px-6 py-2 rounded-full font-bold text-sm tracking-wider font-content-en shadow-lg ${status ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}`}>
                                        {status ? 'ONLINE ACTIVE' : 'SYSTEM OFFLINE'}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Members Manager
        const MembersView = () => {
            const [members, setMembers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingMember, setEditingMember] = useState(null);
            const [formData, setFormData] = useState({});
            const [search, setSearch] = useState('');

            const statusOptions = [
                { label: 'Active', value: 'Active' },
                { label: 'On Vacation', value: 'On Vacation' },
                { label: 'Resigned', value: 'Resigned' },
                { label: 'Banned', value: 'Banned' }
            ];

            useEffect(() => { fetchMembers(); }, []);

            const fetchMembers = async () => {
                setLoading(true);
                let { data: memData, error } = await supabaseClient.from('members').select('*, member_priority(priority)');
                if (error) { console.error(error); alert("Failed to fetch members"); }
                if (memData) {
                    let sorted = memData.map(m => ({
                        ...m,
                        priority: m.member_priority && m.member_priority.length > 0 ? m.member_priority[0].priority : 999
                    })).sort((a, b) => a.priority - b.priority);
                    setMembers(sorted);
                }
                setLoading(false);
            };

            const handleSave = async () => {
                try {
                    // Remove id and relational fields before updating/inserting
                    let payload = { ...formData };
                    delete payload.id;
                    delete payload.priority;
                    delete payload.member_priority;

                    if (editingMember) {
                        const { error } = await supabaseClient.from('members').update(payload).eq('id', editingMember.id);
                        if (error) { alert("Update failed: " + error.message); return; }
                    } else {
                        if(!payload.password) payload.password = '123456';
                        const { data, error } = await supabaseClient.from('members').insert([payload]).select();
                        if (error) { alert("Insert failed: " + error.message); return; }
                        if(data && data.length > 0) {
                            await supabaseClient.from('member_priority').insert([{ member_code: data[0].mdf_code, priority: 999 }]);
                        }
                    }
                    setIsModalOpen(false);
                    fetchMembers();
                } catch (e) {
                    console.error(e);
                    alert("Error saving member");
                }
            };

            const handleDelete = async (id) => {
                if(confirm("আপনি কি নিশ্চিত এই মেম্বারকে ডিলিট করতে চান?")) {
                    const { error } = await supabaseClient.from('members').delete().eq('id', id);
                    if(error) alert("Delete failed: " + error.message);
                    else fetchMembers();
                }
            };

            const movePriority = async (index, direction) => {
                if ((direction === 'up' && index === 0) || (direction === 'down' && index === members.length - 1)) return;
                const curr = members[index];
                const swapIdx = direction === 'up' ? index - 1 : index + 1;
                const swap = members[swapIdx];

                let newMembers = [...members];
                newMembers[index] = swap;
                newMembers[swapIdx] = curr;
                setMembers(newMembers);

                await Promise.all([
                    supabaseClient.from('member_priority').upsert({ member_code: curr.mdf_code, priority: swapIdx }),

        // 3. Teams Manager

                let payload = {...formData};
                delete payload.id;

        // 8. Download (ID CARD GENERATOR)
        const DownloadView = () => {
            const [members, setMembers] = useState([]);
            const [selectedCodes, setSelectedCodes] = useState([]);
            const [isGenerating, setIsGenerating] = useState(false);

            useEffect(() => {
                const f = async () => {
                    const { data } = await supabaseClient.from('members').select('*').order('mdf_code');
                    if(data) setMembers(data);
                };
                f();
            }, []);

            const toggleSelect = (code) => {
                if(selectedCodes.includes(code)) setSelectedCodes(selectedCodes.filter(c => c !== code));
                else setSelectedCodes([...selectedCodes, code]);
            };

            const loadImage = (url) => {
                return new Promise((resolve) => {
                    if(!url) return resolve(null);
                    const img = new Image();
                    img.crossOrigin = 'Anonymous';
                    img.src = url;
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                });
            };

            const generatePDF = async () => {
                if (selectedCodes.length === 0) return alert("মেম্বার নির্বাচন করুন।");
                setIsGenerating(true);

                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    
                    const selectedMembersData = members.filter(m => selectedCodes.includes(m.mdf_code));

                    const cardW = 54;
                    const cardH = 85.6;
                    const topMargin = 15;
                    const leftMargin = 15;
                    const gap = 10;

                    for (let i = 0; i < selectedMembersData.length; i++) {
                        const m = selectedMembersData[i];

                        if (i > 0) pdf.addPage();

                        // Front Canvas
                        const frontCanvas = document.createElement('canvas');
                        frontCanvas.width = 540; frontCanvas.height = 856;
                        const fCtx = frontCanvas.getContext('2d');
                        
                        fCtx.drawImage(preloadedImages.front, 0, 0, 540, 856);

                        let userImg = null;
                        if(m.photo_url) userImg = await loadImage(m.photo_url);

                        const photoSize = 180;
                        const photoX = (540 - photoSize) / 2;
                        const photoY = 250;

                        fCtx.save();
                        fCtx.beginPath();
                        fCtx.arc(photoX + photoSize/2, photoY + photoSize/2, photoSize/2 + 6, 0, Math.PI * 2);
                        fCtx.fillStyle = '#6366f1';
                        fCtx.fill();
                        fCtx.restore();

                        fCtx.save();
                        fCtx.beginPath();
                        fCtx.arc(photoX + photoSize/2, photoY + photoSize/2, photoSize/2 + 3, 0, Math.PI * 2);
                        fCtx.fillStyle = '#ffffff';
                        fCtx.fill();
                        fCtx.restore();

                        fCtx.save();
                        fCtx.beginPath();
                        fCtx.arc(photoX + photoSize/2, photoY + photoSize/2, photoSize/2, 0, Math.PI * 2);
                        fCtx.clip();

                        if (userImg) {
                            fCtx.drawImage(userImg, photoX, photoY, photoSize, photoSize);
                        } else {
                            fCtx.fillStyle = '#1e293b';
                            fCtx.fillRect(photoX, photoY, photoSize, photoSize);
                            fCtx.fillStyle = '#94a3b8';
                            fCtx.font = 'bold 60px "Content-En", sans-serif';
                            fCtx.textAlign = 'center';
                            fCtx.fillText((m.full_name || 'MDF')[0], photoX + photoSize/2, photoY + photoSize/2 + 20);
                        }
                        fCtx.restore();

                        let currentY = photoY + photoSize + 55;

                        fCtx.fillStyle = '#38bdf8';
                        fCtx.textAlign = 'center';
                        fCtx.font = 'bold 28px "Content-En", sans-serif';
                        fCtx.fillText(`MDF ID: ${m.mdf_code || ''}`, 270, currentY);

                        currentY += 45;
                        fCtx.fillStyle = '#ffffff';
                        fCtx.font = 'bold 32px "Content-En", sans-serif';
                        fCtx.fillText(m.full_name || '', 270, currentY);

                        currentY += 40;
                        fCtx.fillStyle = '#f87171';
                        fCtx.font = 'bold 24px "Content-En", sans-serif';
                        fCtx.fillText(`Blood Group: ${m.blood_group || 'N/A'}`, 270, currentY);

                        currentY += 38;
                        fCtx.fillStyle = '#e2e8f0';
                        fCtx.font = 'bold 22px "Content-En", sans-serif';
                        fCtx.fillText(`Phone: ${m.phone || 'N/A'}`, 270, currentY);

                        // Back Canvas
                        const backCanvas = document.createElement('canvas');
                        backCanvas.width = 540; backCanvas.height = 856;
                        const bCtx = backCanvas.getContext('2d');
                        bCtx.drawImage(preloadedImages.back, 0, 0, 540, 856);

                        const qrBoxSize = 250;
                        const qrBoxX = (540 - qrBoxSize) / 2;
                        const qrBoxY = 320;

                        bCtx.save();
                        bCtx.fillStyle = '#ffffff';
                        bCtx.shadowColor = 'rgba(0, 0, 0, 0.25)';
                        bCtx.shadowBlur = 15;
                        bCtx.shadowOffsetY = 5;
                        
                        const r = 20;
                        bCtx.beginPath();
                        bCtx.moveTo(qrBoxX + r, qrBoxY);
                        bCtx.arcTo(qrBoxX + qrBoxSize, qrBoxY, qrBoxX + qrBoxSize, qrBoxY + qrBoxSize, r);
                        bCtx.arcTo(qrBoxX + qrBoxSize, qrBoxY + qrBoxSize, qrBoxX, qrBoxY + qrBoxSize, r);
                        bCtx.arcTo(qrBoxX, qrBoxY + qrBoxSize, qrBoxX, qrBoxY, r);
                        bCtx.arcTo(qrBoxX, qrBoxY, qrBoxX + qrBoxSize, qrBoxY, r);
                        bCtx.closePath();
                        bCtx.fill();
                        bCtx.restore();

                        const qrDiv = document.createElement('div');
                        new QRCode(qrDiv, {
                            text: `https://meherpur-debating-forum.github.io/index.html?member=${m.mdf_code}`,
                            width: 200, height: 200,
                            colorDark : "#000000",
                            colorLight : "#ffffff",
                            correctLevel : QRCode.CorrectLevel.H
                        });
                        
                        await new Promise(res => setTimeout(res, 200)); 
                        const qrCanvas = qrDiv.querySelector('canvas');
                        if (qrCanvas) {
                            bCtx.drawImage(qrCanvas, qrBoxX + 25, qrBoxY + 25, 200, 200); 
                        }

                        pdf.addImage(frontCanvas.toDataURL('image/jpeg', 1.0), 'JPEG', leftMargin, topMargin, cardW, cardH);
                        pdf.addImage(backCanvas.toDataURL('image/jpeg', 1.0), 'JPEG', leftMargin + cardW + gap, topMargin, cardW, cardH);
                    }

                    pdf.save(`MDF_ID_Cards.pdf`);
                } catch (e) {
                    console.error(e);
                    alert("পিডিএফ তৈরিতে সমস্যা হয়েছে।");
                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div className="p-6 space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-header-en text-white">Generate Official ID Cards</h2>
                            <p className="text-xs text-slate-400 font-content-bn">আইডি কার্ড প্রিন্ট এর জন্য সিলেক্ট করে ডাউনলোড করুন</p>
                        </div>
                        <CustomButton onClick={generatePDF} isLoading={isGenerating}><Icons.Download /> Download PDF ({selectedCodes.length})</CustomButton>
                    </div>

                    <div className="glass-card rounded-2xl border border-slate-800 p-4">
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                            {members.map(m => (
                                <div 
                                    key={m.id} 
                                    onClick={() => toggleSelect(m.mdf_code)}
                                    className={`p-3.5 rounded-xl border cursor-pointer transition-all flex items-center gap-3 ${selectedCodes.includes(m.mdf_code) ? 'bg-indigo-600/20 border-indigo-500' : 'bg-slate-900/40 border-slate-800 hover:border-slate-700'}`}
                                >
                                    <div className={`w-5 h-5 rounded-md border flex-shrink-0 flex items-center justify-center ${selectedCodes.includes(m.mdf_code) ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-700'}`}>
                                        {selectedCodes.includes(m.mdf_code) && <Icons.BadgeCheck className="w-3.5 h-3.5" />}
                                    </div>
                                    <div className="overflow-hidden">
                                        <p className="font-bold text-xs text-indigo-400 font-content-en">{m.mdf_code}</p>
                                        <p className="text-xs text-slate-200 truncate font-content-bn">{m.full_name}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

                                    </button>
                                </form>
                                
                                <div className="mt-8 pt-6 border-t border-slate-800/80 text-center">
                                    <p className="text-[10px] text-slate-500 font-content-en tracking-widest uppercase">Authorized Personnel Only</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const menuItems = [
                { id: 'dashboard', label: 'ড্যাশবোর্ড', icon: Icons.Dashboard },
                { id: 'members', label: 'মেম্বারস', icon: Icons.Users },
                { id: 'teams', label: 'টিমস', icon: Icons.Teams },
                { id: 'participations', label: 'পার্টিসিপেশন্স', icon: Icons.Trophy },
                { id: 'committees', label: 'কমিটি', icon: Icons.Committee },
                { id: 'activities', label: 'অ্যাক্টিভিটিস', icon: Icons.Activity },
                { id: 'approvals', label: 'স্কিলস', icon: Icons.BadgeCheck },
                { id: 'download', label: 'আইডি কার্ড', icon: Icons.Download },
            ];

            const renderView = () => {
                switch(currentView) {
                    case 'dashboard': return <DashboardView />;
                    case 'members': return <MembersView />;
                    case 'teams': return <TeamsView />;
                    case 'participations': return <ParticipationsView />;
                    case 'committees': return <CommitteesView />;
                    case 'activities': return <ActivitiesView />;
                    case 'approvals': return <ApprovalsView />;
                    case 'download': return <DownloadView />;
                    default: return <DashboardView />;
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-slate-950">
                    <aside className="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800 z-10">
                        <div className="p-6 border-b border-slate-800 flex items-center justify-center">
                            <h1 className="text-2xl font-black text-indigo-500 font-header-en tracking-widest">MDF<span className="text-slate-500 font-light">PANEL</span></h1>
                        </div>
                        <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto custom-scrollbar">
                            {menuItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setCurrentView(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-content-bn font-medium text-left text-sm ${currentView === item.id ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                                >
                                    <item.icon />
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <button onClick={handleLogout} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-rose-400 hover:bg-rose-500/10 transition-colors font-content-bn font-medium text-sm">
                                <Icons.LogOut /> লগআউট
                            </button>
                        </div>
                    </aside>

                    <div className="md:hidden fixed top-0 left-0 right-0 h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-20">
                        <h1 className="text-xl font-black text-indigo-500 font-header-en">MDF<span className="text-slate-500">PANEL</span></h1>
                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-slate-300 p-2"><Icons.Menu /></button>
                    </div>

                    {isMobileMenuOpen && (
                        <div className="md:hidden fixed inset-0 bg-slate-950/80 z-30 backdrop-blur-md" onClick={() => setIsMobileMenuOpen(false)}>
                            <div className="absolute right-0 top-0 bottom-0 w-64 bg-slate-900 border-l border-slate-800 shadow-2xl flex flex-col" onClick={e => e.stopPropagation()}>
                                <div className="p-4 flex justify-end border-b border-slate-800"><button onClick={() => setIsMobileMenuOpen(false)} className="text-slate-400"><Icons.X/></button></div>
                                <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
                                    {menuItems.map(item => (
                                        <button key={item.id} onClick={() => { setCurrentView(item.id); setIsMobileMenuOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-left font-content-bn text-sm ${currentView === item.id ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                                            <item.icon /> {item.label}
                                        </button>
                                    ))}
                                </nav>
                                <div className="p-4 border-t border-slate-800"><button onClick={handleLogout} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-rose-400 hover:bg-rose-500/10 text-sm"><Icons.LogOut /> লগআউট</button></div>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 flex flex-col h-full relative pt-16 md:pt-0 overflow-hidden bg-slate-950">
                        <div className="flex-1 overflow-y-auto custom-scrollbar relative z-0">
                            {renderView()}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
