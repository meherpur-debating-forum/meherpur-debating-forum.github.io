<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — This Motion Has Been Withdrawn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#4e4066;
    --purple-mid:#6f5b92;
    --purple-light:#7d6aa5;
    --gold:#ffc541;
    --gold-deep:#f4b73b;
    --gold-warm:#f9c358;
    --coral:#fa976c;
    --coral-deep:#f78d5e;
    --brown:#b65c32;
    --bg:#faf7f2;
    --ink:#2e2640;
    --ink-soft:#5b5470;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow-x:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2.5rem 1.5rem 3.5rem;
    text-align:center;
  }

  .stage{
    width:100%;
    max-width:760px;
    margin:0 auto;
  }

  .stage svg{
    display:block;
    width:100%;
    height:auto;
  }

  .content{
    max-width:560px;
    margin-top:-1.5rem;
  }

  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.16em;
    font-size:.78rem;
    font-weight:600;
    color:var(--purple-mid);
    margin:0 0 .85rem;
  }

  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:700;
    font-size:clamp(1.7rem, 4.2vw, 2.5rem);
    line-height:1.18;
    color:var(--purple-deep);
    margin:0 0 .9rem;
  }

  .lede{
    font-size:1rem;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0 0 2.1rem;
  }

  .btn-home{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    background:var(--purple-deep);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:.95rem;
    padding:.85rem 1.75rem;
    border-radius:999px;
    box-shadow:0 10px 22px -10px rgba(78,64,102,.55);
    transition:transform .18s ease, box-shadow .18s ease, background-color .18s ease;
  }

  .btn-home svg{
    width:16px;
    height:16px;
    flex-shrink:0;
    transition:transform .18s ease;
  }

  .btn-home:hover{
    background:var(--purple-mid);
    transform:translateY(-2px);
    box-shadow:0 14px 26px -10px rgba(78,64,102,.6);
  }

  .btn-home:hover svg{ transform:translateX(3px); }

  .btn-home:focus-visible{
    outline:3px solid var(--gold);
    outline-offset:3px;
  }

  @media (max-width:640px){
    .page{ padding:1.75rem 1.25rem 3rem; }
    .stage{ max-width:420px; }
    .content{ margin-top:-.5rem; }
    .lede{ font-size:.94rem; margin-bottom:1.8rem; }
  }

  /* ---------- illustration palette (kept from source artwork) ---------- */
  .cls-1{ fill:#ffc541; }
  .cls-2{ fill:#4e4066; }
  .cls-3{ fill:#6f5b92; }
  .cls-4{ fill:#f78d5e; }
  .cls-5{ fill:#fa976c; }
  .cls-6,.cls-7,.cls-8{ fill:#b65c32; }
  .cls-7{ opacity:.4; }
  .cls-9{ fill:#f4b73b; }
  .cls-11{ fill:#f9c358; }
  .cls-12{ fill:#9b462c; }
  .cls-13{ fill:#aa512e; }
  .cls-14{ fill:#7d6aa5; }

  /* stroke utilities for the speaker figure */
  .stroke-purple{ stroke:#6f5b92; fill:none; stroke-linecap:round; }
  .stroke-gold{ stroke:#ffc541; stroke-width:3; fill:none; stroke-linecap:round; }

  /* ---------- shared / unchanged animations ---------- */
  .clock-hand-1{ animation:clock-rotate 3s linear infinite; transform-origin:bottom; transform-box:fill-box; }
  .clock-hand-2{ animation:clock-rotate 6s linear infinite; transform-origin:bottom; transform-box:fill-box; transform:rotate(130.4deg); }
  @keyframes clock-rotate{ 100%{ transform:rotate(360deg); } }

  .circle{ animation:circle-anim ease infinite; transform-origin:center; transform-box:fill-box; }
  .circle.c1{ animation-duration:2s; }
  .circle.c2{ animation-duration:3s; }
  .circle.c3{ animation-duration:1s; }
  .circle.c4{ animation-duration:1s; }
  .circle.c5{ animation-duration:2s; }
  .circle.c6{ animation-duration:3s; }
  @keyframes circle-anim{ 50%{ transform:scale(.2) rotateX(360deg) rotateY(360deg); } }

  .four,#ou{ animation:four-anim cubic-bezier(.39,.575,.565,1) infinite; }
  .four.a{ transform-origin:bottom left; animation-duration:3s; transform-box:fill-box; }
  .four.b{ transform-origin:bottom right; animation-duration:3s; transform-box:fill-box; }
  #ou{ animation-duration:6s; transform-origin:center; transform-box:fill-box; }
  @keyframes four-anim{ 50%{ transform:scale(.98); } }

  /* ---------- re-themed prop animations ---------- */
  #mic-stand{ animation:mic-sway 6s linear infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes mic-sway{ 25%{ transform:translateY(10px) rotate(5deg); } 75%{ transform:rotate(-5deg); } }

  #paper-note{ animation:paper-flutter 3s linear infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes paper-flutter{ 25%{ transform:rotate(10deg) translateY(5px); } 75%{ transform:rotate(-10deg); } }

  #pen{ animation:pen-write 3s cubic-bezier(.455,.03,.515,.955) infinite; transform-origin:top left; transform-box:fill-box; }
  @keyframes pen-write{ 50%{ transform:rotate(-6deg); } }

  #podium-top{ animation:podium-flip 2s linear infinite; transform-origin:right top; transform-box:fill-box; }
  @keyframes podium-flip{ 50%{ transform:rotate(-5deg); } }

  #desk{ animation:desk-wobble 3s linear infinite; transform-origin:top; transform-box:fill-box; }
  @keyframes desk-wobble{ 50%{ transform:rotate(4deg); } }

  /* ---------- walking speaker ---------- */
  #speaker-walk{ animation:walker-slide 6s ease infinite; }
  @keyframes walker-slide{
    0%{ transform:translateX(-1300px); }
    50%{ transform:translateX(0); animation-timing-function:cubic-bezier(.47,0,.745,.715); }
    100%{ transform:translateX(1300px); }
  }

  .figure-body{ animation:body-bob .8s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes body-bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }

  .leg-left,.leg-right{ transform-origin:top center; transform-box:fill-box; animation:leg-swing .8s ease-in-out infinite; }
  .leg-left{ animation-delay:0s; }
  .leg-right{ animation-delay:.4s; }
  @keyframes leg-swing{ 0%,100%{ transform:rotate(20deg); } 50%{ transform:rotate(-20deg); } }

  .arm-back{ transform-origin:top; transform-box:fill-box; animation:arm-swing .8s ease-in-out infinite; }
  @keyframes arm-swing{ 0%,100%{ transform:rotate(-15deg); } 50%{ transform:rotate(15deg); } }

  .speech-wave{ transform-origin:left center; transform-box:fill-box; opacity:0; animation:speak 1.2s ease-in-out infinite; }
  .speech-wave:nth-of-type(1){ animation-delay:0s; }
  .speech-wave:nth-of-type(2){ animation-delay:.2s; }
  .speech-wave:nth-of-type(3){ animation-delay:.4s; }
  @keyframes speak{ 0%{ opacity:0; transform:scale(.6); } 30%{ opacity:1; transform:scale(1); } 70%{ opacity:.6; } 100%{ opacity:0; transform:scale(.6); } }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation:none !important; transition:none !important; }
  }
</style>
</head>
